[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-maps-scraper"
version = "1.0.0"
description = "A Google Maps scraper built with Python and Playwright"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "JuarisTech", email = "admin@juaristech.com"},
]
keywords = ["google-maps", "scraper", "playwright", "web-scraping", "restaurant-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

dependencies = [
    "playwright>=1.40.0",
    "requests>=2.32.0",
    "xlwt>=1.3.0",
]

[project.urls]
Homepage = "https://juaristech.com/google-maps-scraper"
Repository = "https://github.com/juaristech/google-maps-scraper"
Documentation = "https://juaristech.com/google-maps-scraper"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["."]
